name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start local Supabase for SD-015 security checks
        run: npm run supabase:ci:start

      - name: Replay local migrations from a clean database
        run: npm run supabase:db:reset

      - name: Test database constraints and RLS
        run: npm run supabase:test:db

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Verify audit exception scope
        run: npm run test:audit-policy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Check client bundle for credential patterns
        run: npm run test:client-bundle-secrets

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Authenticated Course security browser tests
        run: npm run test:e2e:security
